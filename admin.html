<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Portfolio</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <style>
    :root {
      --bg: #080c10;
      --surface: #0e1318;
      --border: rgba(255, 255, 255, 0.07);
      --accent: #3b82f6;
      --text: #e8ecf0;
      --muted: #6b7a8d;
      --card: #111820;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    h1,
    h2,
    h3 {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Login Screen */
    #login-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login-card {
      background: var(--card);
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 400px;
    }

    .login-card h2 {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    /* Admin Dashboard */
    #dashboard-section {
      display: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .tab-btn {
      padding: 0.75rem 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Forms */
    .admin-form {
      background: var(--card);
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .admin-form h3 {
      margin-bottom: 1.5rem;
    }

    #editor {
      background: #fff;
      color: #000;
      height: 300px;
      border-radius: 0 0 4px 4px;
    }

    .ql-toolbar {
      background: #f3f4f6;
      border-radius: 4px 4px 0 0;
    }

    .data-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .data-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .data-item h4 {
      margin-bottom: 0.25rem;
    }

    .data-item p {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .action-btn {
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login-section" class="container">
    <div class="login-card">
      <h2>Admin Login</h2>
      <div id="login-error" style="color: #ef4444; margin-bottom: 1rem; font-size: 0.85rem; display: none;"></div>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="admin@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" id="login-btn">Login</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-section" class="container">
    <header>
      <h2>Admin Dashboard</h2>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="blogs">Blogs</button>
      <button class="tab-btn" data-tab="experience">Experience</button>
      <button class="tab-btn" data-tab="projects">Projects</button>
      <button class="tab-btn" data-tab="gallery">Gallery</button>
    </div>

    <!-- BLOGS TAB -->
    <div id="blogs" class="tab-content active">
      <div class="admin-form">
        <h3>Write a New Blog</h3>
        <form id="blog-form">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="blog-title" required>
          </div>
          <div class="form-group">
            <label>Summary</label>
            <input type="text" id="blog-summary" required>
          </div>
          <div class="form-group">
            <label>Content</label>
            <div id="editor"></div>
          </div>
          <button type="submit" class="btn" style="width: auto; padding: 0.75rem 2rem;">Publish Blog</button>
        </form>
      </div>
      <h3>Existing Blogs</h3>
      <div class="data-list" id="blogs-list"></div>
    </div>

    <!-- EXPERIENCE TAB -->
    <div id="experience" class="tab-content">
      <div class="admin-form">
        <h3>Add Experience</h3>
        <form id="exp-form">
          <div class="form-group">
            <label>Role / Title</label>
            <input type="text" id="exp-role" required>
          </div>
          <div class="form-group">
            <label>Company</label>
            <input type="text" id="exp-company" required>
          </div>
          <div class="form-group">
            <label>Duration</label>
            <input type="text" id="exp-duration" placeholder="e.g. Feb 2026 — Present" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <input type="text" id="exp-desc" required>
          </div>
          <button type="submit" class="btn" style="width: auto; padding: 0.75rem 2rem;">Add Experience</button>
        </form>
      </div>
      <h3>Existing Experience</h3>
      <div class="data-list" id="exp-list"></div>
    </div>

    <!-- PROJECTS TAB -->
    <div id="projects" class="tab-content">
      <div class="admin-form">
        <h3>Add Project / Gallery Item</h3>
        <form id="proj-form">
          <div class="form-group">
            <label>Project Title</label>
            <input type="text" id="proj-title" required>
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="proj-image" placeholder="https://..." required>
          </div>
          <div class="form-group">
            <label>Technologies (Comma separated)</label>
            <input type="text" id="proj-tech" placeholder="React, Node.js, Tailwind" required>
          </div>
          <div class="form-group">
            <label>Problem</label>
            <input type="text" id="proj-problem" required>
          </div>
          <div class="form-group">
            <label>Solution</label>
            <input type="text" id="proj-solution" required>
          </div>
          <div class="form-group">
            <label>Impact</label>
            <input type="text" id="proj-impact" required>
          </div>
          <div class="form-group">
            <label>Live Demo URL (optional)</label>
            <input type="text" id="proj-live">
          </div>
          <div class="form-group">
            <label>Source Code URL (optional)</label>
            <input type="text" id="proj-code">
          </div>
          <button type="submit" class="btn" style="width: auto; padding: 0.75rem 2rem;">Add Project</button>
        </form>
      </div>
      <h3>Existing Projects</h3>
      <div class="data-list" id="proj-list"></div>
    </div>

    <!-- GALLERY TAB -->
    <div id="gallery" class="tab-content">
      <div class="admin-form">
        <h3>Add Gallery Image</h3>
        <form id="gallery-form">
          <div class="form-group">
            <label>Image Title</label>
            <input type="text" id="gallery-title" required>
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="gallery-image" placeholder="https://..." required>
          </div>
          <div class="form-group">
            <label>Category (e.g. College, Hackathon, Events)</label>
            <input type="text" id="gallery-category" placeholder="College" required>
          </div>
          <button type="submit" class="btn" style="width: auto; padding: 0.75rem 2rem;">Add to Gallery</button>
        </form>
      </div>
      <h3>Current Gallery</h3>
      <div class="data-list" id="gallery-list"></div>
    </div>

  </div>

  <!-- Supabase & Quill JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <!-- App Logic -->
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>

</html>
